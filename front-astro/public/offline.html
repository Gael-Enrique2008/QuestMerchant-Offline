<!doctype html>
<html lang="es-MX">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#30435f">
  <title>Sin conexión | Quest Merchant</title>
  <link rel="icon" href="/icons/quest-192.png">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; font: 1rem/1.55 system-ui, sans-serif; background: #e9f0f9; color: #30435f; }
    main { max-width: 34rem; padding: clamp(1.5rem, 6vw, 3rem); background: #fff; border: 1px solid #ced9e8; border-radius: 24px; box-shadow: 0 16px 50px #30435f18; }
    img { display: block; height: 52px; width: 52px; border-radius: 12px; }
    h1 { margin: .75rem 0 .25rem; font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.1; }
    p { margin: .9rem 0 1.4rem; }
    a { display: inline-block; padding: .65rem 1.05rem; border-radius: .8rem; background: #30435f; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/quest-192.png" alt="">
    <h1>Esta página no está guardada</h1>
    <p>Quest Merchant no pudo conectarse. Regresa al catálogo que ya consultaste o recupera la conexión y vuelve a abrir esta página.</p>
    <a href="/">Volver al catálogo</a>
  </main>

</html>
